services:
  openbao:
    image: ${OPENBAO_IMAGE}
    container_name: ingestion_openbao
    # Start as root so the entrypoint can correct ownership of the bind-mounted
    # data directory. It always drops to the unprivileged `openbao` user before
    # starting the server, so OpenBao itself does not run as root.
    user: "0:0"
    cap_add:
      - IPC_LOCK
    command: server -config=/openbao/config/openbao.hcl
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    # Supplies OPENBAO_UNSEAL_KEY for the static seal. The key is kept here
    # rather than in openbao.hcl because the server reads its config after
    # dropping privileges, so the config file cannot be root-only.
    env_file:
      - ${OPENBAO_UNSEAL_ENV_FILE}
    volumes:
      - ./generated/openbao.hcl:/openbao/config/openbao.hcl:ro
      - ${OPENBAO_DATA_PATH}:/openbao/data
    ports:
      - "${OPENBAO_HOST_BIND:-127.0.0.1}:${OPENBAO_HOST_PORT:-8200}:8200"
    restart: unless-stopped
    healthcheck:
      # `bao status` exits 0 when unsealed and 2 when sealed or uninitialized.
      # Both mean the API is answering, which is the condition the bootstrap
      # needs: it cannot initialize a server that must already be unsealed.
      test: ["CMD-SHELL", "bao status >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]"]
      interval: 5s
      timeout: 5s
      retries: 12

  openbao-bootstrap:
    image: ${OPENBAO_IMAGE}
    container_name: ingestion_openbao_bootstrap
    # Runs as root to write the token file and hand it to the Airflow UID.
    user: "0:0"
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: ${OPENBAO_ADDR}
      OPENBAO_SEAL_MODE: ${OPENBAO_SEAL_MODE}
      OPENBAO_KV_MOUNT: ${OPENBAO_KV_MOUNT}
      OPENBAO_SECRET_PREFIX: ${OPENBAO_SECRET_PREFIX}
      OPENBAO_POLICY_NAME: ${OPENBAO_POLICY_NAME}
      OPENBAO_TOKEN_PERIOD: ${OPENBAO_TOKEN_PERIOD}
      OPENBAO_RECOVERY_SHARES: ${OPENBAO_RECOVERY_SHARES}
      OPENBAO_RECOVERY_THRESHOLD: ${OPENBAO_RECOVERY_THRESHOLD}
      AIRFLOW_UID: ${AIRFLOW_UID}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      INGESTION_DB_NAME: ${INGESTION_DB_NAME}
      INGESTION_DB_USER: ${INGESTION_DB_USER}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD}
    entrypoint: ["/bin/sh", "/bootstrap/openbao-bootstrap.sh"]
    volumes:
      - ./generated/openbao-bootstrap.sh:/bootstrap/openbao-bootstrap.sh:ro
      - ${OPENBAO_TOKEN_FILE_PATH}:/run/openbao/ingestion.token
      - ${OPENBAO_INIT_FILE_PATH}:/run/openbao/init.json
    restart: "no"

  postgres:
    image: postgres:15.8-alpine
    container_name: ingestion_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      INGESTION_DB_NAME: ${INGESTION_DB_NAME}
      INGESTION_DB_USER: ${INGESTION_DB_USER}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD}
    volumes:
      - ${POSTGRES_DATA_PATH}:/var/lib/postgresql/data
      - ./generated/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: ingestion_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${MINIO_DATA_PATH}:/data
      - ${MINIO_CERTS_PATH}:/root/.minio/certs:ro
    ports:
      - "${MINIO_API_HOST_BIND:-0.0.0.0}:${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_BIND:-0.0.0.0}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-bootstrap:
    image: minio/mc:RELEASE.2024-01-18T16-59-06Z
    container_name: ingestion_minio_bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SCHEME: ${MINIO_SCHEME}
      MINIO_BRONZE_BUCKET: ${MINIO_BRONZE_BUCKET}
      MINIO_LANDING_BUCKET: ${MINIO_LANDING_BUCKET}
      MINIO_SILVER_BUCKET: ${MINIO_SILVER_BUCKET}
      MINIO_GOLD_BUCKET: ${MINIO_GOLD_BUCKET}
      MINIO_QUARANTINE_BUCKET: ${MINIO_QUARANTINE_BUCKET}
    entrypoint: ["/bin/sh", "/bootstrap/minio-bootstrap.sh"]
    volumes:
      - ./generated/minio-bootstrap.sh:/bootstrap/minio-bootstrap.sh:ro
    restart: "no"

  airflow-init:
    build:
      context: ../..
      dockerfile: deploy/single-node-airflow/Dockerfile.airflow
      args:
        AIRFLOW_VERSION: "2.8.1"
        PYTHON_VERSION: "3.10"
        INSTALL_MSSQL_ODBC: ${INSTALL_MSSQL_ODBC:-true}
    image: vt-airflow-ingestion:single-node
    container_name: ingestion_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
      # Airflow bind-mounts the OpenBao token, so it must not start until the
      # bootstrap has written a valid one.
      openbao-bootstrap:
        condition: service_completed_successfully
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME}
      INGESTION_DB_NAME: ${INGESTION_DB_NAME}
      INGESTION_DB_USER: ${INGESTION_DB_USER}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD}
      INGESTION_AUDIT_DB_URL: ${INGESTION_AUDIT_DB_URL_REF}
      OPENBAO_ADDR: ${OPENBAO_ADDR}
      OPENBAO_TOKEN_FILE: /run/secrets/openbao_token
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SCHEME: ${MINIO_SCHEME}
      MINIO_BRONZE_BUCKET: ${MINIO_BRONZE_BUCKET}
    user: "${AIRFLOW_UID}:0"
    volumes: &airflow-volumes
      - ${AIRFLOW_DAGS_PATH}:/opt/airflow/dags
      - ${AIRFLOW_LOGS_PATH}:/opt/airflow/logs
      - ${AIRFLOW_PLUGINS_PATH}:/opt/airflow/plugins
      - ${AIRFLOW_CONFIG_PATH}:/opt/airflow/config
      - ${OPENBAO_TOKEN_FILE_PATH}:/run/secrets/openbao_token:ro
      - ./config/webserver_config.py:/opt/airflow/webserver_config.py:ro
      - ./generated/airflow-bootstrap.sh:/opt/airflow/bootstrap/airflow-bootstrap.sh:ro
    command: bash /opt/airflow/bootstrap/airflow-bootstrap.sh
    restart: "no"

  airflow-scheduler:
    image: vt-airflow-ingestion:single-node
    container_name: ingestion_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    user: "${AIRFLOW_UID}:0"
    volumes: *airflow-volumes
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-webserver:
    image: vt-airflow-ingestion:single-node
    container_name: ingestion_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    user: "${AIRFLOW_UID}:0"
    volumes: *airflow-volumes
    ports:
      - "${AIRFLOW_HOST_BIND:-0.0.0.0}:${AIRFLOW_HOST_PORT:-8080}:8080"
    command: webserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
