object_id: itron_mv90_cmmastst_customer_master_archive
source_system: itron_mv90_sqlserver
source_type: database
object_name: mv90
enabled: true
load_strategy: incremental
extraction:
  db_type: sql_server
  connection_name: WVP-SQL19-AG
  database_name: mv90
  schema_name: dbo
  table_name: CMMASTST
  query: SELECT * FROM dbo.CMMASTST WHERE LOAD_TSTZ > :last_watermark;
  incremental_column: load_tstz
  watermark_type: timestamp
  watermark:
    column: load_tstz
    operator: '>'
    initial_value: '1900-01-01T00:00:00Z'
    value_type: timestamp
    timezone: UTC
    commit_rule: max_extracted_value_after_successful_write
    late_arriving_overlap: 0 minutes
schema_policy:
  mode: hybrid
  column_case: snake_case
  replace_spaces_with: _
  allow_schema_evolution: true
  include_unmodeled_columns: true
  infer_types: true
  column_discovery: source_metadata
  type_discovery: source_metadata
schema:
  columns:
    customerid:
      type: string
      nullable: false
      mask_policy: none
      source_column_name: CUSTOMERID
    load_tstz:
      type: timestamp
      nullable: false
      mask_policy: none
      source_column_name: LOAD_TSTZ
target:
  storage_name: itron_mv90_bronze
  zone: bronze
  format: parquet
  write_mode: append
  compression: snappy
  partition_by:
  - ingest_year
  - ingest_month
  - ingest_day
audit:
  dq_checks:
  - row_count_gt_zero
  - primary_key_not_null
  - primary_key_unique
  - load_tstz_not_null
  primary_key:
  - customerid
security:
  classification: confidential
  contains_bcsi: false
  contains_pii: false
  encryption_required: true
  masking_required: false
  raw_payload_retention_days: 365
  access_group: itron_mv90_customer_data_readers
