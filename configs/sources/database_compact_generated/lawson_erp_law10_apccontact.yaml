object_id: lawson_erp_law10_apccontact
source_system: lawson_erp
source_type: database
object_name: APCCONTACT
enabled: true
load_strategy: full
extraction:
  db_type: sql_server
  connection_name: lawson_erp_sqlserver_readonly
  database_name: LAW10
  schema_name: dbo
  table_name: APCCONTACT
  query: SELECT * FROM dbo.APCCONTACT  -- one pass per table; 1911 tables total
schema_policy:
  mode: hybrid
  column_case: snake_case
  replace_spaces_with: _
  allow_schema_evolution: true
  include_unmodeled_columns: true
  infer_types: true
  column_discovery: source_metadata
  type_discovery: source_metadata
schema:
  columns:
    phone_nmbr:
      type: string
      nullable: false
      mask_policy: redact
      source_column_name: PHONE_NMBR
    phone_ext:
      type: string
      nullable: false
      mask_policy: redact
      source_column_name: PHONE_EXT
    mobile_num:
      type: string
      nullable: false
      mask_policy: redact
      source_column_name: MOBILE_NUM
    mobile_ext:
      type: string
      nullable: false
      mask_policy: redact
      source_column_name: MOBILE_EXT
    e_mail_address:
      type: string
      nullable: false
      mask_policy: redact
      source_column_name: E_MAIL_ADDRESS
target:
  storage_name: itron_mv90_bronze
  zone: bronze
  format: parquet
  write_mode: append
  compression: snappy
  partition_by:
  - ingest_year
  - ingest_month
  - ingest_day
audit:
  dq_checks:
  - row_count_match_per_table
  - all_tables_extracted
  - tokenize_cols_masked
  - hash_cols_applied
  - redact_applied_at_silver
  - sse_kms_encryption_verified
  - access_group_enforced
  - no_raw_sensitive_in_target
  - schema_column_count_match
  - null_check_key_cols
  - no_duplicate_rows
  primary_key: []
security:
  classification: confidential
  contains_bcsi: false
  contains_pii: true
  encryption_required: true
  masking_required: true
  raw_payload_retention_days: 2555
  access_group: lawson_law10_data_readers
