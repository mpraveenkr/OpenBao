object_id: itron_mv90_mmmastst_meter_channel
source_system: itron_mv90
source_type: database
object_name: mmmastst_meter_channel
enabled: true
load_strategy: incremental
extraction:
  db_type: sql_server
  connection_name: itron_mv90_sqlserver_readonly
  database_name: MV90
  schema_name: dbo
  table_name: MMMASTST
  query: SELECT * FROM dbo.MMMASTST WHERE LOAD_TSTZ > :last_watermark
  incremental_column: load_tstz
  watermark_type: timestamp
  watermark:
    column: load_tstz
    operator: '>'
    initial_value: '1900-01-01T00:00:00Z'
    value_type: timestamp
    timezone: UTC
    commit_rule: max_extracted_value_after_successful_write
    late_arriving_overlap: 0 minutes
schema_policy:
  mode: hybrid
  column_case: snake_case
  replace_spaces_with: _
  allow_schema_evolution: true
  include_unmodeled_columns: true
  infer_types: true
  column_discovery: source_metadata
  type_discovery: source_metadata
schema:
  columns:
    recorderid:
      type: string
      nullable: false
      mask_policy: none
      source_column_name: RECORDERID
    physicalchannel:
      type: integer
      nullable: false
      mask_policy: none
      source_column_name: PHYSICALCHANNEL
    load_tstz:
      type: timestamp
      nullable: false
      mask_policy: none
      source_column_name: LOAD_TSTZ
target:
  storage_name: itron_mv90_bronze
  zone: bronze
  format: parquet
  write_mode: append
  compression: snappy
  partition_by:
  - ingest_year
  - ingest_month
  - ingest_day
audit:
  dq_checks:
  - row_count_gt_zero
  - composite_pk_not_null
  - composite_pk_unique
  - rowid_unique
  - load_tstz_not_null
  - changetype_valid_values
  - recorderid_fk_check
  - physicalchannel_positive
  - etl_batch_nbr_not_null
  primary_key:
  - recorderid
  - physicalchannel
security:
  classification: confidential
  contains_bcsi: false
  contains_pii: false
  encryption_required: true
  masking_required: false
  raw_payload_retention_days: 365
  access_group: itron_mv90_meter_data_readers
